version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  APP_NAME: "versebearer"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Целевая ОС сборки. По умолчанию — та, на которой запускаемся; задаётся
  # явно (`wails3 task build GOOS=linux`) для кросс-компиляции.
  GOOS: '{{.GOOS | default OS}}'
  # Режим сборки. DEV=true — без тега production, см. комментарий к BUILD_FLAGS
  # в build/windows/Taskfile.yml. Значение по умолчанию задано здесь, чтобы
  # платформенным веткам всегда было что сравнивать.
  DEV: '{{.DEV | default "false"}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
    env:
      # DEV читают двое. Сборка — чтобы не ставить тег production и отдать фронт
      # vite-серверу (живая перезагрузка Svelte). Само приложение — чтобы брать
      # приёмник из reciever/dist на диске, где его пересобирает watcher, а не
      # из вшитой копии. godotenv.Load() не перетирает уже заданное окружение,
      # так что это значение бьёт DEV=false из .env; обычный `task build` DEV не
      # выставляет, поэтому собранная и упакованная версии берут вшитую копию.
      DEV: "true"

  test:
    summary: Runs Go unit tests (in-memory SQLite, no Wails/frontend deps)
    cmds:
      - go test ./...
