version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for Windows
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
      - task: common:build:reciever
      - task: common:generate:icons
      - task: fetch:ffmpeg
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
      - cmd: powershell Remove-item *.syso
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
      # Копирование — здесь, а не в deps fetch:ffmpeg: каталог bin/ создаёт
      # именно go build выше, а deps в go-task выполняются параллельно — рядом
      # с ним fetch:ffmpeg мог бы отработать раньше, чем bin/ появится.
      - cmd: powershell Copy-Item build/windows/ffmpeg/ffmpeg.exe "{{.BIN_DIR}}/ffmpeg.exe" -Force
        platforms: [windows]
    vars:
      # DEV=true собирает без тега production: тогда Wails компилирует dev-ветку
      # assetserver'а, которая читает FRONTEND_DEVSERVER_URL и проксирует фронт
      # на vite. С тегом та же функция возвращает пустую строку, окно показывает
      # вшитый frontend/dist, и правки .svelte видны только после пересборки Go.
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui"{{end}}'
    env:
      GOOS: windows
      # Обязательно 1: sqlite-драйвер (mattn/go-sqlite3) — cgo-обёртка.
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  package:
    summary: Packages a production build of the application into a `.exe` bundle
    cmds:
      - task: create:nsis:installer

  generate:syso:
    summary: Generates Windows `.syso` file
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  create:nsis:installer:
    summary: Creates an NSIS installer
    dir: build/windows/nsis
    deps:
      - task: build
    cmds:
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      - makensis -DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe" project.nsi
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      ARG_FLAG: '{{if eq .ARCH "amd64"}}AMD64{{else}}ARM64{{end}}'

  run:
    cmds:
      - '{{.BIN_DIR}}\\{{.APP_NAME}}.exe'

  fetch:ffmpeg:
    summary: Скачивает ffmpeg для установщика (в git не хранится — сотня мегабайт)
    run: once
    dir: build/windows          # ⚠️ ОБЯЗАТЕЛЬНО: задачи выполняются от корня проекта.
    # Без dir status смотрел бы в <корень>/ffmpeg/ffmpeg.exe, которого нет
    # никогда — и 162 МБ качались бы при каждой сборке.
    status:
      - test -f ffmpeg/ffmpeg.exe
    cmds:
      # BtbN, LGPL static win64, .zip (не .7z — его штатный Expand-Archive не
      # осилит). Извлекаем только bin/ffmpeg.exe и LICENSE.txt: ffprobe/ffplay
      # не нужны, длительность и формат после импорта считает beep.
      - cmd: powershell -NoProfile -Command '$ErrorActionPreference="Stop"; $url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-8.1.zip"; $zip=Join-Path $env:TEMP "vb-ffmpeg.zip"; $extractDir=Join-Path $env:TEMP "vb-ffmpeg-extract"; Invoke-WebRequest -Uri $url -OutFile $zip; if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }; Expand-Archive -Path $zip -DestinationPath $extractDir -Force; $root=Get-ChildItem $extractDir | Select-Object -First 1; New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null; Copy-Item (Join-Path $root.FullName "bin\ffmpeg.exe") "ffmpeg\ffmpeg.exe" -Force; Copy-Item (Join-Path $root.FullName "LICENSE.txt") "ffmpeg\LICENSE.txt" -Force; Remove-Item $zip -Force; Remove-Item $extractDir -Recurse -Force'
        platforms: [windows]
